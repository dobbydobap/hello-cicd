name: Hello GitHub Actions
on:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello from Varshitha!"
      - name: Say who ran it
        run: echo "Run by ${{ github.actor }} on ${{ github.repository }}"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a
