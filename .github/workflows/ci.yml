name: Python CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml

      # keep the test report even when tests fail, so it can be downloaded and read
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show build output
        run: |
          ls -la build
          cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/

  docker:
    name: Build and test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t hello-cicd:${{ github.sha }} .

      - name: Run the container and check it answers
        run: |
          docker run -d --name app -p 8000:8000 -e APP_API_KEY=ci-test-key hello-cicd:${{ github.sha }}
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          echo
          curl -sf localhost:8000/
          echo
          # without the key the API must refuse, with it the maths must be right
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/calc/add?a=2&b=3')" = "401"
          curl -sf -H "X-API-Key: ci-test-key" 'localhost:8000/calc/add?a=2&b=3' | grep -q '"result":5.0'
          echo "container checks passed"

      - name: Container logs
        if: always()
        run: docker logs app || true
